name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static checks + Playwright (unit, E2E, visual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image (and Playwright version) that produced the versioned Linux baselines: the visual
    # suite runs here as-is (ADR 11), with no browser download.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      # The container runs as another user than the checkout: let git (commit stamp of the build) read it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Dependency audit (runtime)
        run: npm audit --omit=dev

      - name: Playwright (unit + desktop/mobile/tablet + visual)
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
